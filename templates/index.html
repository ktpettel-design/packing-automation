<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Packing Automation</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 12px;
            color: #1a1a1a;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 24px 20px 32px;
        }
        h1 { text-align: center; font-size: 22px; margin: 0 0 4px; color: #111; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; font-size: 15px; margin-bottom: 8px; }
        .file-drop {
            border: 2px dashed #ccc;
            border-radius: 14px;
            padding: 28px 16px;
            text-align: center;
            background: #fafafa;
            cursor: pointer;
            transition: 0.2s;
        }
        .file-drop:active, .file-drop.dragover { border-color: #4f46e5; background: #eef2ff; }
        .file-drop p { margin: 0; color: #555; font-size: 15px; }
        .file-list { margin-top: 10px; font-size: 13px; color: #333; text-align: left; }
        button {
            width: 100%;
            background: #4f46e5;
            color: white;
            border: none;
            padding: 16px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            margin-top: 8px;
        }
        button:active { background: #4338ca; }
        .flash {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 14px;
        }
        .note { font-size: 12px; color: #888; text-align: center; margin-top: 20px; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Packing Automation</h1>
        <p class="subtitle">Upload invoices → Get stamped PDFs + Summary</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <form method="POST" enctype="multipart/form-data" id="form">
            <div class="form-group">
                <label>SKU Master Sheet</label>
                <div class="file-drop" onclick="document.getElementById('sku').click()">
                    <p>Tap to select .xlsx file</p>
                    <div class="file-list" id="skuList"></div>
                </div>
                <input type="file" id="sku" name="sku_master" accept=".xlsx,.xls" required style="display:none">
            </div>

            <div class="form-group">
                <label>Amazon Invoice PDFs</label>
                <div class="file-drop" onclick="document.getElementById('pdfs').click()">
                    <p>Tap to select PDFs (multiple OK)</p>
                    <div class="file-list" id="pdfList"></div>
                </div>
                <input type="file" id="pdfs" name="pdfs" accept=".pdf" multiple required style="display:none">
            </div>

            <button type="submit" id="btn">Process & Download ZIP</button>
        </form>

        <p class="note">Works on phone & laptop. Results come as a ZIP file.</p>
    </div>

    <script>
        function setup(inputId, listId) {
            const input = document.getElementById(inputId);
            const list = document.getElementById(listId);
            input.onchange = () => {
                list.innerHTML = Array.from(input.files).map(f => '<div>✓ ' + f.name + '</div>').join('');
            };
        }
        setup('sku', 'skuList');
        setup('pdfs', 'pdfList');

        document.getElementById('form').onsubmit = () => {
            document.getElementById('btn').textContent = 'Processing...';
            document.getElementById('btn').disabled = true;
        };
    </script>
</body>
</html>
